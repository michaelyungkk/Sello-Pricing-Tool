name: CI Guardrails

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Encoding Guardrail
        run: npm run lint:encoding

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate Release Notes Feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/generate-release-notes.js

      - name: Commit Release Notes Feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/release-notes.json; then
            echo "No release-notes changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/release-notes.json
          git commit -m "chore: update release notes feed [skip ci]"
          git push
